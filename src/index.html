<!DOCTYPE html>
<html lang="ja-JP">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title></title>
  <style>
    :root {
      --font-app: sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0; padding: 0; min-height: 100vh;
      background: #000;
      font-family: var(--font-app);
      color: #fff;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: grid;
      place-items: center;
    }
    .game-wrap {
      position: relative;
      width: min(100vw, 133.333333vh);
      height: min(100vh, 75vw);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #0a0e27;
      touch-action: none;
    }
    @supports (height: 100dvh) {
      .game-wrap {
        width: min(100vw, 133.333333dvh);
        height: min(100dvh, 75vw);
      }
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #0a0e27;
      outline: none;
      touch-action: none;
      user-select: none;
    }
    .game-wrap:fullscreen {
      width: 100dvw;
      height: 100dvh;
      max-width: none;
      max-height: none;
      aspect-ratio: auto;
    }
    .game-wrap:fullscreen #game {
      width: 100%;
      height: 100%;
    }

    /* HUD */
    .hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between;
      pointer-events: none;
      font-family: var(--font-app);
      font-size: 13px;
    }
    .hud-col { display: flex; flex-direction: column; gap: 6px; }
    .hud-col.right { align-items: flex-end; }
    .hud-item {
      background: rgba(0, 0, 0, 0.45);
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .fuel-bay {
      width: 184px;
      padding: 8px 10px 9px;
      background: rgba(4, 8, 24, 0.72);
      border: 1px solid rgba(68, 221, 255, 0.18);
      box-shadow: 0 0 24px rgba(68, 221, 255, 0.08), inset 0 0 18px rgba(255, 68, 170, 0.06);
    }
    .fuel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      letter-spacing: 0;
    }
    .fuel-he4 {
      color: #ffcc44;
      font-variant-numeric: tabular-nums;
    }
    .fuel-he4.bump {
      animation: he4-bump 0.28s ease-out;
    }
    .fuel-row {
      display: grid;
      grid-template-columns: 16px 1fr;
      align-items: center;
      gap: 7px;
      margin: 5px 0;
      min-height: 28px;
    }
    .fuel-label {
      color: rgba(255, 255, 255, 0.76);
      font-weight: 800;
    }
    .fuel-slots {
      position: relative;
      height: 28px;
      min-width: 1px;
      max-width: 132px;
    }
    .fuel-slot {
      position: absolute;
      top: 0;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.18s ease, filter 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
    }
    .fuel-slot img {
      width: 25px;
      height: 25px;
      object-fit: contain;
      display: block;
    }
    .fuel-slot.filled {
      filter: none;
      opacity: 1;
      transform: scale(1);
    }
    .fuel-slot.filled.d {
      box-shadow: 0 0 12px rgba(68, 221, 255, 0.42);
    }
    .fuel-slot.filled.t {
      box-shadow: 0 0 12px rgba(102, 255, 153, 0.36);
    }
    .fuel-slot.pop {
      animation: fuel-pop 0.26s cubic-bezier(.2,1.4,.4,1);
    }
    .fuel-slot.burst {
      animation: fuel-burst 0.32s ease-out;
    }
    .fuel-fallback {
      font-size: 12px;
      font-weight: 900;
    }
    .fusion-ready {
      min-height: 16px;
      margin-top: 6px;
      color: #ffcc44;
      font-size: 11px;
      text-align: center;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.14s ease, transform 0.14s ease;
    }
    .fusion-ready.active {
      opacity: 1;
      transform: scale(1);
      animation: ready-pulse 0.6s ease-in-out infinite;
    }
    @keyframes fuel-pop {
      0% { transform: scale(0.75); }
      70% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }
    @keyframes fuel-burst {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.5) rotate(15deg); opacity: 0; }
    }
    @keyframes he4-bump {
      0% { transform: scale(1); }
      55% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    @keyframes ready-pulse {
      50% { transform: scale(1.08); text-shadow: 0 0 12px #ffcc44; }
    }
    .combo-hud {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      pointer-events: none;
    }
    .combo-ring {
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      opacity: 0;
      filter: grayscale(1);
      transform: scale(0.88);
      transition: opacity 0.18s ease, transform 0.18s ease, filter 0.15s ease;
      background: rgba(4, 8, 24, 0.78);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04), 0 0 18px rgba(255, 204, 68, 0.1);
    }
    .combo-ring.active {
      opacity: 1;
      filter: grayscale(0);
      transform: scale(1);
    }
    .combo-ring.bump {
      animation: combo-ring-bump 0.25s cubic-bezier(.2,1.7,.35,1);
    }
    .combo-ring.urgent {
      animation: combo-ring-urgent 0.18s linear infinite alternate;
    }
    .combo-ring svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    .combo-ring .ring-track {
      fill: transparent;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 5;
    }
    .combo-ring .ring-progress {
      fill: transparent;
      stroke: var(--combo-color, #ff8844);
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke 0.08s linear;
    }
    .combo-ring .ring-count {
      position: relative;
      z-index: 1;
      color: #fff;
      font: 800 18px/1 var(--font-app);
      text-shadow: 0 0 3px #000, 0 0 8px var(--combo-color, #ff8844);
    }
    .combo-ring.urgent .ring-progress {
      stroke: #ff5544;
    }
    @keyframes combo-ring-bump {
      0% { transform: scale(1); }
      45% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    @keyframes combo-ring-urgent {
      from { box-shadow: 0 0 0 rgba(255, 85, 68, 0); }
      to { box-shadow: 0 0 12px rgba(255, 85, 68, 0.58); }
    }
    .ignition-bar {
      position: absolute;
      left: 50%;
      bottom: 24px;
      width: min(480px, calc(100% - 32px));
      height: 44px;
      transform: translate(-50%, 72px);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(.2,1.2,.35,1), opacity 0.2s ease;
      font-family: var(--font-app);
    }
    .ignition-bar.active {
      transform: translate(-50%, 0);
      opacity: 1;
    }
    .ignition-bar.bump {
      animation: ignition-bar-bump 0.25s cubic-bezier(.2,1.45,.35,1);
    }
    .ignition-bar.complete {
      animation: ignition-bar-complete 0.32s ease-out forwards;
    }
    .ignition-label {
      height: 20px;
      margin-bottom: 6px;
      text-align: center;
      color: rgba(255, 255, 255, 0.88);
      font: 700 18px/1 var(--font-app);
      text-shadow: 0 0 10px rgba(255, 204, 68, 0.5);
    }
    .ignition-track {
      position: relative;
      width: 100%;
      height: 18px;
      overflow: hidden;
      border-radius: 9px;
      background: #0a0e27;
      border: 2px solid #ffcc44;
      box-shadow: 0 0 18px rgba(255, 204, 68, 0.35), inset 0 0 10px rgba(0, 0, 0, 0.7);
    }
    .ignition-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, #ff44aa 0%, #ff8844 52%, #ffcc44 100%);
      box-shadow: 0 0 16px rgba(255, 204, 68, 0.65);
      transition: width 0.08s linear;
    }
    .ignition-fill::after {
      content: "";
      position: absolute;
      top: 3px;
      right: -2px;
      width: 28px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      filter: blur(1px);
    }
    @keyframes ignition-bar-bump {
      0% { transform: translate(-50%, 0) scale(1); filter: brightness(1); }
      45% { transform: translate(-50%, 0) scale(1.08); filter: brightness(1.35); }
      100% { transform: translate(-50%, 0) scale(1); filter: brightness(1); }
    }
    @keyframes ignition-bar-complete {
      0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -12px) scale(1.18); opacity: 0; }
    }
    .pulse-ring {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid #44ddff;
      opacity: 0.4;
      pointer-events: none;
      z-index: 3;
    }
    .pulse-ring.active {
      animation: pulse 0.4s ease-out;
    }
    @keyframes pulse {
      0%   { transform: translateX(-50%) scale(1); opacity: 1; box-shadow: 0 0 16px #44ddff; }
      100% { transform: translateX(-50%) scale(1.4); opacity: 0; box-shadow: 0 0 0 #44ddff; }
    }
    .lang-switch {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 5;
    }
    .lang-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255, 136, 204, 0.72);
      background: rgba(0, 0, 0, 0.46);
      color: #fff;
      font: 600 18px/1 var(--font-app);
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 18px rgba(255, 136, 204, 0.18);
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }
    .lang-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 136, 204, 0.18);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 0 22px rgba(255, 136, 204, 0.28);
    }
    .lang-btn:focus-visible {
      outline: 2px solid #44ddff;
      outline-offset: 3px;
    }
    .view-controls {
      position: absolute;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 6;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }
    .fullscreen-btn {
      min-width: 72px;
      min-height: 38px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(68, 221, 255, 0.68);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font: 800 12px/1 var(--font-app);
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 18px rgba(68, 221, 255, 0.16);
      transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }
    .fullscreen-btn:hover {
      transform: translateY(-1px);
      background: rgba(68, 221, 255, 0.16);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), 0 0 22px rgba(68, 221, 255, 0.26);
    }
    .fullscreen-btn:focus-visible {
      outline: 2px solid #ff88cc;
      outline-offset: 3px;
    }
    .fullscreen-hint {
      max-width: min(280px, 52vw);
      padding: 8px 11px;
      border-radius: 8px;
      border: 1px solid rgba(255, 204, 68, 0.5);
      background: rgba(0, 0, 0, 0.68);
      color: #ffe18a;
      font: 800 12px/1.35 var(--font-app);
      text-align: left;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(255, 204, 68, 0.12);
    }

    /* Overlays */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10, 14, 39, 0.88);
      text-align: center; padding: 2rem;
      backdrop-filter: blur(2px);
    }
    .overlay h1 {
      margin: 0 0 0.5rem;
      font-size: 30px; font-weight: 600;
      color: #ff88cc;
      letter-spacing: 1px;
    }
    .overlay h2 {
      margin: 0 0 1rem;
      font-size: 22px; font-weight: 500;
      color: #ff88cc;
    }
    .subtitle {
      margin: 0 0 1.5rem;
      color: rgba(255, 255, 255, 0.55);
      font-size: 14px;
      letter-spacing: 2px;
    }
    .tutorial {
      margin: 0.5rem 0 1.8rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-line;
    }
    .menu-toggles {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(100%, 520px);
      margin: 0 0 0.7rem;
    }
    .menu-toggle-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .difficulty-btn,
    .audience-btn,
    .tutorial-toggle-btn {
      min-width: 92px;
      min-height: 34px;
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid rgba(255, 136, 204, 0.55);
      background: rgba(0, 0, 0, 0.22);
      color: rgba(255, 255, 255, 0.78);
      font: 700 12px/1 var(--font-app);
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease, color 0.14s ease, transform 0.14s ease;
    }
    .audience-btn {
      min-width: 112px;
      text-transform: none;
    }
    .tutorial-toggle-btn {
      min-width: 146px;
      text-transform: none;
      border-color: rgba(255, 255, 255, 0.28);
    }
    .difficulty-btn:hover,
    .audience-btn:hover,
    .tutorial-toggle-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(68, 221, 255, 0.72);
      color: #fff;
      background: rgba(68, 221, 255, 0.10);
    }
    .difficulty-btn.active,
    .audience-btn.active {
      border-color: #44ddff;
      background: rgba(68, 221, 255, 0.18);
      color: #fff;
      box-shadow: 0 0 0 1px rgba(68, 221, 255, 0.24), 0 0 18px rgba(68, 221, 255, 0.22);
    }
    .tutorial-toggle-btn.active {
      border-color: #66ff99;
      background: rgba(39, 190, 98, 0.36);
      color: #fff;
      box-shadow: 0 0 0 1px rgba(102, 255, 153, 0.24), 0 0 18px rgba(102, 255, 153, 0.18);
    }
    .tutorial-toggle-btn.inactive {
      border-color: rgba(255, 255, 255, 0.24);
      background: rgba(150, 156, 170, 0.24);
      color: rgba(255, 255, 255, 0.66);
      box-shadow: none;
    }
    .difficulty-btn:focus-visible,
    .audience-btn:focus-visible,
    .tutorial-toggle-btn:focus-visible {
      outline: 2px solid #ff88cc;
      outline-offset: 3px;
    }
    .key {
      display: inline-block;
      padding: 1px 8px;
      border: 1px solid #ff88cc;
      border-radius: 4px;
      color: #ff88cc;
      font-family: var(--font-app);
    }
    .start-hint {
      display: inline-grid;
      place-items: center;
      font-size: 16px;
      font-family: var(--font-app);
      font-weight: 800;
      line-height: 1;
      color: #ff88cc;
      margin-top: 0.5rem;
      animation: blink 1.4s ease-in-out infinite;
      min-width: 120px;
      min-height: 40px;
      padding: 8px 18px;
      border: 1px solid rgba(255, 136, 204, 0.62);
      border-radius: 999px;
      background: rgba(255, 136, 204, 0.1);
      cursor: pointer;
      appearance: none;
    }
    .start-hint:hover {
      background: rgba(255, 136, 204, 0.18);
    }
    .start-hint:focus-visible {
      outline: 2px solid #44ddff;
      outline-offset: 3px;
    }
    @keyframes blink { 50% { opacity: 0.5; } }
    .lab {
      position: absolute;
      bottom: 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1.5px;
    }

    .stats {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1.7;
      white-space: pre-line;
      margin-bottom: 1rem;
    }
    .body {
      max-width: 480px;
      font-size: 14px;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.85);
      white-space: pre-line;
      margin: 0 auto 0.7rem;
    }
    .footer {
      max-width: 460px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.6;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 0.7rem;
      margin: 0.5rem auto 0;
    }
    .actions {
      display: flex; flex-direction: column; align-items: center; gap: 0.6rem;
      margin-top: 1.2rem;
    }
    .btn {
      padding: 8px 22px;
      background: transparent;
      color: #ff88cc;
      border: 1px solid #ff88cc;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(255, 136, 204, 0.15); }
    .btn:disabled { opacity: 0.3; cursor: default; }
    .btn-primary {
      background: #ff4488;
      color: #fff;
      border-color: #ff4488;
    }
    .btn-primary:hover { background: #ff5599; }

    /* Modal */
    .modal-content {
      width: min(540px, 100%);
      max-width: 540px;
    }
    .learn-illust {
      display: block;
      width: 100%;
      height: 200px;
      object-fit: contain;
      margin: 0 0 0.8rem;
    }
    #screen-tutorial {
      padding: 0;
      overflow: hidden;
      display: none;
      background: transparent;
      text-align: center;
      backdrop-filter: none;
    }
    .tutorial-dim,
    .tutorial-focus-ring,
    .tutorial-card-content {
      position: absolute;
      pointer-events: none;
    }
    .tutorial-dim {
      background: rgba(2, 5, 18, 0.62);
      backdrop-filter: blur(1px);
      animation: tutorial-dim-in 0.18s ease-out both;
    }
    .tutorial-focus-ring {
      border: 2px solid rgba(68, 221, 255, 0.95);
      border-radius: 16px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 18px rgba(68, 221, 255, 0.55),
        inset 0 0 18px rgba(255, 136, 204, 0.16);
      animation: tutorial-focus-pulse 1.45s ease-in-out infinite;
    }
    .tutorial-card-content {
      left: 50%;
      width: min(420px, calc(100% - 32px));
      max-height: min(76vh, 430px);
      padding: 14px 16px 16px;
      overflow: hidden;
      transform: translateX(-50%);
      border-radius: 8px;
      border: 1px solid rgba(68, 221, 255, 0.62);
      background: rgba(5, 10, 31, 0.9);
      box-shadow:
        0 0 0 1px rgba(255, 136, 204, 0.16),
        0 16px 42px rgba(0, 0, 0, 0.48),
        0 0 28px rgba(68, 221, 255, 0.18);
      animation: tutorial-card-in 0.22s ease-out both;
      pointer-events: auto;
    }
    .tutorial-card-content h2 {
      margin-bottom: 0.45rem;
      font-size: 19px;
      line-height: 1.25;
    }
    .tutorial-card-content .body {
      max-width: none;
      margin-bottom: 0;
      font-size: 13px;
      line-height: 1.55;
    }
    .tutorial-illust {
      display: block;
      width: 100%;
      height: 154px;
      object-fit: contain;
      margin: 0 auto 0.65rem;
    }
    .tutorial-hint {
      margin-top: 0.8rem;
      color: #66ff99;
      font-size: 14px;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(102, 255, 153, 0.36);
    }
    .tutorial-close-btn {
      margin-top: 0.7rem;
      min-width: 118px;
      min-height: 38px;
      padding: 9px 22px;
      border-color: #66ff99;
      background: rgba(39, 190, 98, 0.32);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 0 0 1px rgba(102, 255, 153, 0.22), 0 0 18px rgba(102, 255, 153, 0.16);
    }
    .tutorial-close-btn:hover {
      background: rgba(39, 190, 98, 0.48);
    }
    .tutorial-close-btn:focus-visible {
      outline: 2px solid #44ddff;
      outline-offset: 3px;
    }
    @keyframes tutorial-dim-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes tutorial-card-in {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes tutorial-focus-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.2),
          0 0 14px rgba(68, 221, 255, 0.45),
          inset 0 0 14px rgba(255, 136, 204, 0.12);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.26),
          0 0 26px rgba(68, 221, 255, 0.72),
          inset 0 0 22px rgba(255, 136, 204, 0.2);
      }
    }
    .modal-nav {
      width: min(380px, 100%);
      display: grid;
      grid-template-columns: 112px 56px 112px;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 1rem auto 0;
    }
    .modal-nav .btn {
      width: 112px;
      padding-inline: 0;
      text-align: center;
      white-space: nowrap;
    }
    .page-indicator {
      width: 56px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 600px) {
      .hud {
        top: 8px;
        left: 8px;
        right: 8px;
        font-size: 11px;
      }
      .hud-item {
        padding: 4px 8px;
      }
      .fuel-bay {
        width: 156px;
        padding: 7px 8px 8px;
      }
      .fuel-slots {
        max-width: 112px;
      }
      .fuel-slot {
        width: 24px;
        height: 24px;
      }
      .fuel-slot img {
        width: 21px;
        height: 21px;
      }
      .overlay {
        padding: 1.25rem;
      }
      .overlay h1 {
        font-size: 24px;
      }
      .overlay h2 {
        font-size: 20px;
      }
      .tutorial,
      .body {
        font-size: 13px;
      }
      .menu-toggles {
        gap: 6px;
      }
      .menu-toggle-row {
        gap: 6px;
      }
      .difficulty-btn,
      .audience-btn,
      .tutorial-toggle-btn {
        min-width: 76px;
        min-height: 32px;
        padding-inline: 10px;
        font-size: 11px;
      }
      .audience-btn {
        min-width: 94px;
      }
      .tutorial-toggle-btn {
        min-width: 126px;
      }
      .learn-illust {
        height: 150px;
      }
      .tutorial-illust {
        height: 118px;
      }
      .lang-switch {
        right: 8px;
        bottom: 8px;
      }
      .view-controls {
        left: max(8px, env(safe-area-inset-left));
        bottom: max(8px, env(safe-area-inset-bottom));
      }
      .fullscreen-btn {
        min-width: 68px;
        min-height: 36px;
        padding-inline: 12px;
      }
      .fullscreen-hint {
        max-width: min(240px, 58vw);
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <canvas id="game" tabindex="0"></canvas>

    <div class="pulse-ring" id="hud-pulse-ring"></div>
    <div class="combo-hud">
      <div class="hud-item combo-ring" id="hud-combo-ring">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle class="ring-track" cx="24" cy="24" r="18"></circle>
          <circle class="ring-progress" cx="24" cy="24" r="18"></circle>
        </svg>
        <span class="ring-count"></span>
      </div>
    </div>
    <div class="ignition-bar" id="hud-ignition-bar">
      <div class="ignition-label" id="hud-ignition-label"></div>
      <div class="ignition-track">
        <div class="ignition-fill" id="hud-ignition-fill"></div>
      </div>
    </div>
    <div class="lang-switch" id="language-switch">
      <button class="lang-btn" id="lang-toggle" type="button"></button>
    </div>
    <div class="view-controls" id="view-controls">
      <button class="fullscreen-btn" id="fullscreen-toggle" type="button"></button>
      <div class="fullscreen-hint" id="fullscreen-hint" style="display:none"></div>
    </div>

    <div class="hud">
      <div class="hud-col">
        <div class="hud-item" id="hud-temp"></div>
        <div class="hud-item fuel-bay" id="hud-fuel-bay"></div>
      </div>
      <div class="hud-col right">
        <div class="hud-item" id="hud-score"></div>
        <div class="hud-item" id="hud-time"></div>
      </div>
    </div>

    <div class="overlay" id="screen-menu">
      <h1 id="menu-title"></h1>
      <div class="subtitle" id="menu-subtitle"></div>
      <div class="tutorial" id="menu-tutorial"></div>
      <div class="menu-toggles" id="menu-toggles">
        <div class="menu-toggle-row" id="difficulty-toggle-row">
          <button class="difficulty-btn" type="button" data-difficulty="easy" id="difficulty-easy"></button>
          <button class="difficulty-btn" type="button" data-difficulty="normal" id="difficulty-normal"></button>
          <button class="difficulty-btn" type="button" data-difficulty="hard" id="difficulty-hard"></button>
        </div>
        <div class="menu-toggle-row" id="audience-toggle-row">
          <button class="audience-btn" type="button" data-audience="kid" id="audience-kid"></button>
          <button class="audience-btn" type="button" data-audience="teen" id="audience-teen"></button>
        </div>
        <div class="menu-toggle-row" id="tutorial-toggle-row">
          <button class="tutorial-toggle-btn" type="button" id="tutorial-toggle"></button>
        </div>
      </div>
      <button class="start-hint" id="menu-start" type="button"></button>
      <div class="lab" id="menu-lab"></div>
    </div>

    <div class="overlay" id="screen-death" style="display:none">
      <h2 id="death-title">💥</h2>
      <div class="stats" id="death-stats"></div>
      <div class="body" id="death-body"></div>
      <div class="footer" id="death-footer"></div>
      <div class="actions">
        <button class="start-hint" id="death-restart" type="button"></button>
        <button class="btn" id="death-learnmore-btn"><span id="death-learnmore"></span></button>
      </div>
    </div>

    <div class="overlay" id="screen-learn" style="display:none">
      <div class="modal-content">
        <img class="learn-illust" id="learn-illust" alt="">
        <h2 id="learn-heading"></h2>
        <div class="body" id="learn-body"></div>
        <div class="modal-nav">
          <button class="btn" id="learn-prev"></button>
          <span class="page-indicator" id="learn-page"></span>
          <button class="btn" id="learn-next"></button>
        </div>
        <button class="btn btn-primary" id="learn-close-btn" style="margin-top: 1rem;"><span id="learn-close"></span></button>
      </div>
    </div>

    <div class="overlay" id="screen-tutorial" style="display:none">
      <div class="tutorial-dim" id="tutorial-dim-top"></div>
      <div class="tutorial-dim" id="tutorial-dim-right"></div>
      <div class="tutorial-dim" id="tutorial-dim-bottom"></div>
      <div class="tutorial-dim" id="tutorial-dim-left"></div>
      <div class="tutorial-focus-ring" id="tutorial-focus-ring"></div>
      <div class="tutorial-card-content" id="tutorial-card">
        <img class="tutorial-illust" id="tutorial-illust" alt="">
        <h2 id="tutorial-title"></h2>
        <div class="body" id="tutorial-body"></div>
        <div class="tutorial-hint" id="tutorial-hint"></div>
        <button class="btn tutorial-close-btn" id="tutorial-close-btn" type="button"></button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
